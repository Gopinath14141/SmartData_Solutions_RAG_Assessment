[project]
name = "sec-10q-rag"
version = "0.1.0"
description = "Multimodal RAG information-retrieval system over an SEC Form 10-Q (text, tables, figures)."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "integration: exercises real external services (Qdrant, OpenAI); requires configuration",
    "slow: takes more than a couple of seconds",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]
ignore = [
    "E501",  # line length is enforced by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# assert is the point of a test; RUF001 fires on the en dashes in note headings,
# which test data deliberately mirrors from the document.
"tests/*" = ["S101", "RUF001"]
# Typer's API is function calls in argument defaults. That is the documented
# idiom, not an accident.
"app/cli/*" = ["B008"]

[tool.coverage.run]
source = ["app"]
omit = ["app/api/static/*"]
